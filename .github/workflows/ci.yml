name: ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install -e .[dev]
      - run: npm install -g @ast-grep/cli
      - run: sniff doctor
      - run: sniff test-rules
      - run: python -m pytest tests -q
