name: ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ast-grep
        run: npm install -g @ast-grep/cli
      - name: Doctor
        run: python skills/sniff/scripts/run.py doctor
      - name: Rule fixtures
        run: python skills/sniff/scripts/run.py test-rules
      - name: Unit tests
        run: pip install pytest && pytest skills -v
