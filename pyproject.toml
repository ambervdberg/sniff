[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sniff"
version = "0.9.6"
description = "Token-cheap code-smell skills for AI agents"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
sniff = "skills.sniff.scripts.run:main"

[tool.hatch.build.targets.wheel]
packages = ["skills"]
