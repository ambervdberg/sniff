[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sniff-smells"
version = "0.10.0"
description = "Token-efficient code-smell detection for AI agents"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
sniff = "sniff.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/sniff"]
exclude = ["src/sniff/patterns/rule-tests"]
