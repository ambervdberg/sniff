[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sniff-smells"
version = "0.16.0"
description = "Token-efficient code-smell detection for AI agents"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = ["ast-grep-cli"]

[project.optional-dependencies]
# tomli: tests/test_sdist_contents.py parses pyproject.toml, and 3.10 has no
# stdlib tomllib. Declared rather than leaned on as a transitive pytest dep.
dev = ["pytest", "tomli; python_version < '3.11'"]

[project.scripts]
sniff = "sniff.cli:main"

[project.urls]
Repository = "https://github.com/ambervdberg/sniff"
Issues = "https://github.com/ambervdberg/sniff/issues"
Changelog = "https://github.com/ambervdberg/sniff/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/sniff"]
exclude = ["src/sniff/patterns/rule-tests"]

# Build allowlist
[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/README.md",
  "/CHANGELOG.md",
  "/LICENSE",
]
# /src sweeps in the pattern rule-tests; they are catalog fixtures, not shipped code.
exclude = ["/src/sniff/patterns/rule-tests"]
