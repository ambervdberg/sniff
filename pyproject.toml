[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sniff"
version = "0.9.6"
description = "Token-efficient code-smell detection for AI agents"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
sniff = "sniff.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/sniff"]
