[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sniff-smells"
version = "0.12.0"
description = "Token-efficient code-smell detection for AI agents"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest", "ast-grep-cli"]

[project.scripts]
sniff = "sniff.cli:main"

[project.urls]
Repository = "https://github.com/ambervdberg/sniff"
Issues = "https://github.com/ambervdberg/sniff/issues"
Changelog = "https://github.com/ambervdberg/sniff/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/sniff"]
exclude = ["src/sniff/patterns/rule-tests"]

# Build allowlist
[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/README.md",
  "/CHANGELOG.md",
  "/LICENSE",
]
