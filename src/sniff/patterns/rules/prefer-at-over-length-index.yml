# Prefer .at() over length-index access
# Generated by ast-skill-create for the ast-lint catalog. Run via the ast-lint
# skill (one `ast-grep scan` pass over all rules), not on its own.
id: prefer-at-over-length-index
language: typescript
severity: warning
message: "Use `.at(-N)` instead of `arr[arr.length - N]`."
metadata:
  languages: [tsx, javascript]
rule:
  pattern: "$ARR[$ARR.length - $N]"
