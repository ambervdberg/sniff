# Nested ternary expressions
# Generated by ast-skill-create for the ast-lint catalog. Run via the ast-lint
# skill (one `ast-grep scan` pass over all rules), not on its own.
id: no-nested-ternary
language: typescript
severity: warning
message: "Nested ternary; extract to if/else or a helper for readability."
rule:
  pattern: "$A ? $B : $C ? $D : $E"
