name: sniff
description: Fail the PR when code-smell counts regress against the committed baseline.
inputs:
  path:
    description: Directory to scan
    default: "."
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: "3.14"
    - name: Install ast-grep and sniff
      shell: bash
      run: |
        npm install -g @ast-grep/cli
        pip install git+https://github.com/ambervdberg/sniff
    - name: Diff against baseline
      shell: bash
      run: sniff diff --comment "${{ inputs.path }}" | tee sniff-diff.md
