name: sniff
description: Fail the PR when new code-smell violations appear against the committed baseline.
inputs:
  path:
    description: Directory to scan
    default: "."
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: "3.14"
    - name: Install ast-grep and sniff
      shell: bash
      run: |
        npm install -g @ast-grep/cli
        # Install this action's own checkout, not the consumer workspace that
        # composite run steps execute in.
        pip install "${{ github.action_path }}"
    - name: Diff against baseline
      shell: bash
      run: sniff diff --comment "${{ inputs.path }}" | tee sniff-diff.md
